<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TurboChat • Desconectado del Servidor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body {
      background: #0b101b;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      user-select: none;
    }
    .card {
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 36px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(37, 99, 235, 0.15);
    }
    .icon-box {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 18px;
      background: linear-gradient(135deg, #ef4444, #f97316);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3);
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ffffff;
    }
    p.desc {
      font-size: 13.5px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      background: #060911;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: #f8fafc;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }
    .btn-primary {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      transform: translateY(-1px);
    }
    .btn-primary:active {
      transform: translateY(0);
    }
    .btn-secondary {
      width: 100%;
      padding: 11px;
      background: transparent;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
    }
    .status-msg {
      font-size: 12.5px;
      margin-top: 14px;
      min-height: 18px;
    }
    .status-error { color: #f87171; }
    .status-info { color: #60a5fa; }
    .status-success { color: #4ade80; }
    .presets {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .preset-chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.15s;
    }
    .preset-chip:hover {
      background: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
      border-color: rgba(59, 130, 246, 0.4);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">
      <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-2.828-6.364 9 9 0 012.828-6.364m0 0L3 3m5.364 5.464a5 5 0 00-1.414 3.536 5 5 0 001.414 3.536" />
      </svg>
    </div>

    <h1>Sin Conexión al Servidor</h1>
    <p class="desc">No pudimos conectar con la instancia de TurboNetwork. Verifica que el servidor esté activo o ajusta la dirección IP de conexión.</p>

    <div class="form-group">
      <label for="server-url">Dirección del Servidor (URL o IP)</label>
      <input type="text" id="server-url" placeholder="https://sistemasisp.tech" autocomplete="off" spellcheck="false">
      <div class="presets">
        <span class="preset-chip" onclick="setPreset('https://sistemasisp.tech')">Producción (sistemasisp.tech)</span>
        <span class="preset-chip" onclick="setPreset('http://localhost:3000')">Localhost:3000</span>
      </div>
    </div>

    <div class="form-group">
      <label for="tenant-slug">Negocio / ISP (Opcional)</label>
      <input type="text" id="tenant-slug" placeholder="Ej: celeris (dejar vacío si es único)" autocomplete="off">
    </div>

    <button id="btn-reconnect" class="btn-primary" onclick="reconnect()">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      <span>Reintentar Conexión</span>
    </button>

    <button class="btn-secondary" onclick="openFullSettings()">Opciones avanzadas</button>

    <div id="status-msg" class="status-msg"></div>
  </div>

  <script>
    const urlInput = document.getElementById('server-url');
    const tenantInput = document.getElementById('tenant-slug');
    const statusMsg = document.getElementById('status-msg');
    const btnReconnect = document.getElementById('btn-reconnect');

    function setPreset(val) {
      urlInput.value = val;
      urlInput.focus();
    }

    async function init() {
      if (window.electronDesktop) {
        const cfg = await window.electronDesktop.getServerConfig();
        if (cfg) {
          urlInput.value = cfg.serverUrl || 'http://localhost:3000';
          tenantInput.value = cfg.tenantSlug || '';
        }
      }
    }

    function showStatus(text, type = 'info') {
      statusMsg.className = `status-msg status-${type}`;
      statusMsg.textContent = text;
    }

    async function reconnect() {
      const url = urlInput.value.trim();
      const tenant = tenantInput.value.trim();

      if (!url) {
        showStatus('Ingresa una dirección de servidor válida', 'error');
        return;
      }

      showStatus('Guardando y conectando...', 'info');
      btnReconnect.disabled = true;

      try {
        if (window.electronDesktop) {
          await window.electronDesktop.saveServerConfig({ serverUrl: url, tenantSlug: tenant });
          window.electronDesktop.reconnect();
        } else {
          location.reload();
        }
      } catch (err) {
        showStatus('Error al intentar reconectar: ' + err.message, 'error');
        btnReconnect.disabled = false;
      }
    }

    function openFullSettings() {
      if (window.electronDesktop) {
        window.electronDesktop.openSettings();
      }
    }

    init();
  </script>
</body>
</html>
