# ==============================================================================
# CONFIGURACIÓN NGINX PARA TURBONETWORK & TURBOCHAT EN PRODUCCIÓN
# Dominio: sistemasisp.tech
# ==============================================================================

# 1. Redirección HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name sistemasisp.tech www.sistemasisp.tech;

    # Permitir renovación automática de certificados Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor Seguro HTTPS (Producción)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sistemasisp.tech www.sistemasisp.tech;

    # Certificados SSL (Gestionados con Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/sistemasisp.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sistemasisp.tech/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Límite de subida de archivos (35MB para notas de voz, fotos, PDFs y comprobantes)
    client_max_body_size 35M;

    # ==========================================================================
    # TIEMPO REAL: SERVER-SENT EVENTS (SSE) PARA MENSAJES Y NOTIFICACIONES
    # Imprescindible para que WhatsApp y TurboChat Desktop reciban mensajes al instante
    # ==========================================================================
    location /api/messages/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Desactivar buffering para streaming continuo de eventos
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Tiempos de espera prolongados para conexiones permanentes
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ==========================================================================
    # DESCARGA DIRECTA DE EJECUTABLES WINDOWS (.EXE)
    # Optimización para descarga rápida del instalador TurboChat Setup y Portable
    # ==========================================================================
    location /descargas/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering on;
        proxy_buffers 16 128k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout 300s;
    }

    # ==========================================================================
    # PROXY GENERAL: API, DASHBOARD WEB & MULTI-TENANT (/t/:tenantSlug/chat)
    # ==========================================================================
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # Soporte para WebSockets y conexiones bidireccionales
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Cabeceras estándar de proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}
